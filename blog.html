<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Emsyne Technologies</title>
    <link href="assets/vendors/aos/aos.css" rel="stylesheet" />
    <link href="assets/css/common.css" rel="stylesheet" />
    <link href="assets/css/footer.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/navbar.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
    <link href="assets/css/blog.css" rel="stylesheet" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="assets/js/navbar-loader.js"></script>
    <script src="assets/js/footer-loader.js"></script>
</head>

<body>
    <div id="navbar-container"></div>

    <main>
        <section class="blog-coming-soon">
            <!-- Animated Background Shapes -->
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>

            <!-- Unique Glass Overlay -->
            <div class="glass-overlay"></div>

            <div class="animation-container">
                <h1 class="coming-soon-title">
                    <span>C</span><span>o</span><span>m</span><span>i</span><span>n</span><span>g</span>
                    <br class="d-md-none">
                    <span>S</span><span>o</span><span>o</span><span>n</span>
                </h1>

                <div class="animation-accent"></div>

                <p class="blog-subtitle">
                    We're building something insightful. Our experts are crafting deep dives into technology,
                    innovation, and the future of digital solutions.
                </p>

                <span class="stay-tuned">Insights | Innovation | Impact</span>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="assets/js/custom.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({ duration: 1200, once: true });

            // GSAP Animations for high-end feel
            const tl = gsap.timeline();

            tl.from(".coming-soon-title span", {
                y: 100,
                opacity: 0,
                duration: 1,
                stagger: 0.05,
                ease: "back.out(1.7)"
            })
                .to(".blog-subtitle", {
                    opacity: 1,
                    y: 0,
                    duration: 0.8,
                    ease: "power2.out"
                }, "-=0.5")
                .from(".stay-tuned", {
                    opacity: 0,
                    letterSpacing: "20px",
                    duration: 1.5,
                    ease: "power3.out"
                }, "-=0.3");

            // Mouse move effect for parallax
            document.addEventListener('mousemove', (e) => {
                const shapes = document.querySelectorAll('.shape');
                const x = (e.clientX - window.innerWidth / 2) * 0.02;
                const y = (e.clientY - window.innerHeight / 2) * 0.02;

                shapes.forEach((shape, index) => {
                    const factor = (index + 1) * 0.5;
                    gsap.to(shape, {
                        x: x * factor,
                        y: y * factor,
                        duration: 1,
                        ease: "power1.out"
                    });
                });
            });
        });
    </script>
</body>

</html>
