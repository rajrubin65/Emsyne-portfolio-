<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Out of the Box Creative</title>
  <link href="assets/vendors/aos/aos.css" rel="stylesheet" />
  <link href="assets/css/footer.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="assets/css/contactsus.css" rel="stylesheet" />
  <!-- ======= Theme Style =======-->
  <link href="assets/css/style.css" rel="stylesheet" />
  <!-- <link href="assets/css/custom_styles.css" rel="stylesheet" /> -->
  <link href="assets/css/navbar.css" rel="stylesheet" />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
  <script src="assets/js/navbar-loader.js"></script>
  <script src="assets/js/footer-loader.js"></script>
  
</head>

<body>
  <!-- Navbar will be loaded here by navbar-loader.js -->
  <div id="navbar-container"></div>

<main id="services-section">
  <div class="container">

    <!-- Contact Title -->
    <div class="mt-custom text-lg-start text-center mb-5">
      <h1 class="hero-title">
        Contact <br />
        <span class="color">Us</span>
      </h1>
    </div>

    <!-- Contact Card -->
    <div class="contact-card contact-tile-card w-100 mb-5">

      <div class="row align-items-stretch g-0">

        <!-- LEFT SIDE IMAGE -->
        <div class="col-md-6" data-aos="fade-right">
          <img src="assets/images/contactus.jpg"
               alt="Contact Image"
               class="img-fluid h-100 w-100 contact-img object-fit-cover">
        </div>

        <!-- RIGHT SIDE FORM -->
        <div class="col-md-6">
          <div class="form-wrapper contact-tile h-100 p-5"
               data-aos="fade-up"
               data-aos-delay="300">

            <form id="contactForm" class="h-100 d-flex flex-column">

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="mb-2" for="name">Name</label>
                  <input class="form-control" id="name" type="text" name="name" required />
                </div>

                <div class="col-md-6">
                  <label class="mb-2" for="email">Email</label>
                  <input class="form-control" id="email" type="email" name="email" required />
                </div>
              </div>

              <div class="mb-3">
                <label class="mb-2" for="subject">Subject</label>
                <input class="form-control" id="subject" type="text" name="subject" />
              </div>

              <div class="mb-3 flex-grow-1">
                <label class="mb-2" for="message">Message</label>
                <textarea class="form-control"
                          id="message"
                          name="message"
                          rows="3"
                          required></textarea>
              </div>

              <button class="btn btn-primary fw-semibold w-100 mt-auto" type="submit">
                Send Message
              </button>

            </form>

            <div class="mt-3 d-none alert alert-success" id="successMessage">
              Message sent successfully!
            </div>

            <div class="mt-3 d-none alert alert-danger" id="errorMessage">
              Message sending failed. Please try again later.
            </div>

          </div>
        </div>

      </div>

    </div>

  </div>
</main>
  </div>
  
  <!-- Footer will be loaded here by footer-loader.js -->
  <div id="footer-container"></div>
  <script src="assets/js/custom.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 1200, once: true });
  </script>
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
  <script src="assets/js/custom.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</body>

</html>
