<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon/favicon.ico" />
  <link href="assets/vendors/aos/aos.css" rel="stylesheet" />
  <link href="assets/css/footer.css" rel="stylesheet" />
  <link href="assets/css/third_party_css/bootstrap-icon/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/third_party_css/font-awesome/all.min.css" />
  <link href="assets/css/third_party_css/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link href="assets/css/contactsus.css" rel="stylesheet" />
  <!-- ======= Theme Style =======-->
  <link href="assets/css/style.css" rel="stylesheet" />
  <!-- <link href="assets/css/custom_styles.css" rel="stylesheet" /> -->
  <link href="assets/css/navbar.css" rel="stylesheet" />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/js/navbar-loader.js" as="script">
  <link rel="preload" href="assets/js/footer-loader.js" as="script">

  <!-- Then defer scripts normally -->
  <script defer src="assets/js/navbar-loader.js"></script>
  <script defer src="assets/js/footer-loader.js"></script>
    <!-- Swiper -->
  <script defer src="assets/css/third_party_css/swiper/swiper-bundle.min.js"></script>
  <!-- GLightbox -->
  <script defer src="assets/css/third_party_css/glightbox/glightbox.min.js"></script>
  <!-- PureCounter -->
  <script defer src="assets/css/third_party_css/purecounter/purecounter_vanilla.js"></script>

</head>

<body>
  <!-- Navbar will be loaded here by navbar-loader.js -->
  <div id="navbar-container"></div>

  <main id="services-section">
    <div class="container">

      <!-- Contact Title -->
      <div class="mt-custom text-lg-start text-center mb-5">
        <h1 class="hero-title"> Contact <br /> <span class="color">Us</span> </h1>
      </div>
      <div class="contact-card contact-tile-card w-100 mb-5">
        <div class="row align-items-stretch g-0"> <!-- LEFT IMAGE -->
          <div class="col-md-6 contact-img-col" data-aos="fade-right"> <img src="assets/images/contactus.webp"
              alt="Contact Image" class="img-fluid h-100 w-100 contact-img object-fit-cover"> </div> <!-- RIGHT FORM -->
          <div class="col-md-6">
            <div class="form-wrapper contact-tile h-100 p-5" data-aos="fade-up" data-aos-delay="300">
              <div id="successMessage" class="d-none text-success">✅ Message sent successfully!</div>
              <form id="contactForm" class="h-100 d-flex flex-column">
                <div class="row g-3 mb-3">
                  <div class="col-md-6"> <label class="mb-2" for="name">Name</label> <input class="form-control"
                      id="name" type="text" name="name" required /> </div>
                  <div class="col-md-6"> <label class="mb-2" for="email">Email</label> <input class="form-control"
                      id="email" type="email" name="email" required /> </div>
                </div>
                <div class="mb-3"> <label class="mb-2" for="subject">Subject</label> <input class="form-control"
                    id="subject" type="text" name="subject" /> </div>
                <div class="mb-3 flex-grow-1"> <label class="mb-2" for="message">Message</label> <textarea
                    class="form-control" id="message" name="message" rows="3" required></textarea> </div>
                <!-- CAPTCHA -->
                <div class="mb-3"> <label class="mb-2">Verification</label>
                  <div class="d-flex align-items-center gap-3"> <canvas id="captchaCanvas" width="160"
                      height="60"></canvas> <button type="button" class="btn btn-outline-secondary btn-sm"
                      onclick="generateCaptcha()"> <i class="fa-solid fa-rotate"></i> </button> </div> <input
                    type="text" id="captchaInput" class="form-control mt-2" placeholder="Enter CAPTCHA" required> <small
                    id="captchaError" class="text-danger d-none"> CAPTCHA incorrect. Please try again. </small>
                </div> <button class="btn btn-primary fw-semibold w-100 mt-auto sbm" type="submit"> Send Message
                </button>
              </form>
              <div class="mt-3 d-none alert alert-success" id="successMessage"> Message sent successfully! </div>

              <div class="mt-3 d-none alert alert-danger" id="errorMessage"> Message sending failed. Please try again
                later. </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
  </div>

  <!-- Footer will be loaded here by footer-loader.js -->
  <div id="footer-container"></div>
  <script defer src="assets/js/captcha.js"></script>
  <script defer src="assets/js/custom.js"></script>

  <script src="assets/css/third_party_css/aos/aos.js"></script>
  <script>
    AOS.init({ duration: 1200, once: true });
  </script>
  <!-- Scripts -->
  <script defer src="assets/css/third_party_css/bootstrapbundle/bootstrap.bundle.min.js"></script>
  <script defer src="assets/css/third_party_css/gsap/gsap.min.js"></script>
  <script defer src="assets/css/third_party_css/scrolltrigger/ScrollTrigger.min.js"></script>
</body>

</html>
