<div id="cookie-consent-overlay" class="cookie-overlay"></div>
<div id="cookie-consent-popup" class="cookie-popup">
    <div class="cookie-content">
        <div class="cookie-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <div class="cookie-text">
            <h4>Cookie Settings</h4>
            <p>We use cookies to enhance your experience, analyze site traffic, and serve better content. Choose your preference below to continue using the site.</p>
        </div>
        <div class="cookie-actions">
            <button id="cookie-reject" class="cookie-btn btn-secondary">Reject All</button>
            <button id="cookie-accept" class="cookie-btn btn-primary">Accept All</button>
        </div>
    </div>
</div>
